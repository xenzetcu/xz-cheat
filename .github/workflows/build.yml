name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Build APK
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/
          
          echo 'apply plugin: "com.android.application"' > build.gradle
          echo 'android { namespace "com.xenzetcu.menu"; compileSdk 34; defaultConfig { applicationId "com.xenzetcu.menu"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" } }' >> build.gradle
          
          echo 'sdk.dir='$ANDROID_HOME > local.properties
          
          gradle wrapper
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XZ-Menu-APK
          path: app/build/outputs/apk/debug/*.apk

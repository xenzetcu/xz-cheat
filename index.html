<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XENZETCU MENU</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
        body { background-color: #0E0E12; color: #FFFFFF; padding: 15px; padding-bottom: 50px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px 0; border-bottom: 1px solid #2A2A35; }
        .title { font-size: 20px; font-weight: bold; color: #C81E1E; letter-spacing: 1px; }
        .status { font-size: 12px; background: #2A1A1A; color: #FF3B3B; padding: 4px 8px; border-radius: 10px; border: 1px solid #C81E1E; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; text-align: center; padding: 12px 0; background: #1A1A24; border-radius: 12px; font-size: 14px; color: #888; }
        .tab.active { background: #C81E1E; color: white; font-weight: bold; }
        .panel { display: none; }
        .panel.active { display: block; }
        .section-title { font-size: 12px; color: #666; margin: 15px 0 10px 5px; text-transform: uppercase; letter-spacing: 1px; }
        .row { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #1A1A24; border-radius: 12px; margin-bottom: 10px; }
        .row-label { font-size: 15px; }
        .toggle { position: relative; width: 50px; height: 28px; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #2A2A35; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #C81E1E; }
        input:checked + .slider:before { transform: translateX(22px); }
        .slider-box { background: #1A1A24; padding: 15px; border-radius: 12px; margin-bottom: 10px; }
        .slider-header { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 15px; }
        .slider-value { color: #C81E1E; font-weight: bold; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: #2A2A35; border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #C81E1E; margin-top: -7px; cursor: pointer; }
        select { width: 100%; padding: 10px; background: #0E0E12; color: white; border: 1px solid #2A2A35; border-radius: 8px; outline: none; margin-top: 5px; }
        .preview-box { margin-top: 20px; background: #1A1A24; border-radius: 12px; height: 300px; display: flex; justify-content: center; align-items: center; position: relative; border: 1px solid #2A2A35; }
        .player-silhouette { width: 60px; height: 180px; background: #3A3A4A; border-radius: 10px 10px 5px 5px; position: relative; }
        .player-head { width: 40px; height: 40px; background: #3A3A4A; border-radius: 50%; position: absolute; top: -45px; left: 10px; }
        .esp-box { position: absolute; border: 2px solid #C81E1E; width: 80px; height: 220px; top: 40px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">XENZETCU MENU</div>
        <div class="status">ONLINE</div>
    </div>
    <div class="tabs">
        <div class="tab active" onclick="switchTab(0)">Игроки</div>
        <div class="tab" onclick="switchTab(1)">Аим</div>
        <div class="tab" onclick="switchTab(2)">Настройки</div>
    </div>
    <div class="panel active" id="panel-0">
        <div class="section-title">Визуал</div>
        <div class="row"><span class="row-label">ESP Box</span><label class="toggle"><input type="checkbox" id="esp-box" checked onchange="toggleESP()"><span class="slider"></span></label></div>
        <div class="row"><span class="row-label">Skeleton</span><label class="toggle"><input type="checkbox"><span class="slider"></span></label></div>
        <div class="row"><span class="row-label">Health Bar</span><label class="toggle"><input type="checkbox"><span class="slider"></span></label></div>
        <div class="section-title">Дистанция</div>
        <div class="slider-box"><div class="slider-header"><span>Макс. дистанция</span><span class="slider-value" id="dist-val">500 м</span></div><input type="range" min="100" max="1000" value="500" oninput="document.getElementById('dist-val').innerText = this.value + ' м'"></div>
    </div>
    <div class="panel" id="panel-1">
        <div class="section-title">Наведение</div>
        <div class="row"><span class="row-label">Silent Aim</span><label class="toggle"><input type="checkbox" checked><span class="slider"></span></label></div>
        <div class="row"><span class="row-label">Wallshot</span><label class="toggle"><input type="checkbox"><span class="slider"></span></label></div>
        <div class="section-title">Параметры</div>
        <div class="slider-box"><div class="slider-header"><span>FOV (Угол)</span><span class="slider-value" id="fov-val">15</span></div><input type="range" min="1" max="180" value="15" oninput="document.getElementById('fov-val').innerText = this.value"></div>
        <div class="slider-box"><div class="slider-header"><span>Точка попадания</span></div><select><option>Голова</option><option>Шея</option><option>Грудь</option></select></div>
    </div>
    <div class="panel" id="panel-2">
        <div class="section-title">Прочее</div>
        <div class="row"><span class="row-label">Водяной знак</span><label class="toggle"><input type="checkbox" checked><span class="slider"></span></label></div>
        <div class="row"><span class="row-label">Скрыть меню (палец)</span><label class="toggle"><input type="checkbox"><span class="slider"></span></label></div>
    </div>
    <div class="preview-box">
        <div class="player-silhouette"><div class="player-head"></div></div>
        <div class="esp-box" id="preview-esp"></div>
    </div>
    <script>
        function switchTab(index) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab')[index].classList.add('active');
            document.getElementById('panel-' + index).classList.add('active');
        }
        function toggleESP() {
            const isChecked = document.getElementById('esp-box').checked;
            const box = document.getElementById('preview-esp');
            box.style.opacity = isChecked ? '1' : '0';
        }
    </script>
</body>
</html>
